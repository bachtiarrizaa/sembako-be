name: Deploy to Development

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod tidy && go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/api/main.go

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}

      - name: Add Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEV_DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Development
        run: |
          ssh ${{ secrets.DEV_DEPLOY_USER }}@${{ secrets.DEV_DEPLOY_HOST }} << 'EOF'
            set -e
            echo "Deploying sembako-be (develop)..."
            cd ~/sembako/sembako-be-dev
            git checkout develop
            git pull origin develop
            docker compose up -d --build
            docker compose exec app make migrate-up
            echo "Development deployed successfully"
          EOF
