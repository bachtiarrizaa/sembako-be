name: sembako-be

services:
  postgres:
    image: postgres:16-alpine
    container_name: sembako-be-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sembako-be

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: sembako-be-api
    ports:
      - '${APP_PORT:-8080}:8080'
    volumes:
      - ./:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sembako-be

networks:
  sembako-be:
    driver: bridge

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
